<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d2b">
  <title>UASE | Aviation Command Center</title>
  <script id="telegram-sdk" defer src="/static/telegram-web-app.js"></script>
  <style>
    :root{--bg:#091522;--panel:#11263a;--panel2:#19364e;--line:#28658a;--cyan:#71c9f5;--text:#eef7ff;--muted:#a8bfd1;--green:#39d98a}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1b4565 0,#0b1b2b 44%,#07121e 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;padding-bottom:90px}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .wrap{max-width:760px;margin:auto;padding:14px 14px 22px}
    .hero{position:relative;overflow:hidden;border:1px solid #2e83b2;border-radius:22px;padding:22px 18px;background:linear-gradient(135deg,#183c59,#0b1d2d 72%);box-shadow:0 12px 35px #0005}
    .hero:after{content:"✈";position:absolute;left:12px;bottom:-27px;font-size:120px;color:#8bd7ff12;transform:rotate(-12deg)}
    .brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;letter-spacing:3px;font-size:30px;color:#9bdcff}.eyebrow{font-size:10px;letter-spacing:2px;color:#9cb8cc}
    .status{font-size:11px;color:#b8f6d7;border:1px solid #276d59;background:#123a35;padding:6px 9px;border-radius:30px}
    h1{font-size:25px;margin:24px 0 4px;line-height:1.35}.sub{color:var(--muted);font-size:14px;margin:0}
    .welcome-ar{font-size:19px;margin:17px 0 2px;font-weight:700}.welcome-en{color:#a9cce2;font-size:13px;direction:ltr;text-align:right}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:25px 2px 12px;gap:10px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:10px;letter-spacing:1.5px;color:#82b9d9;direction:ltr}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .tile{position:relative;min-height:132px;text-align:right;border:1px solid #2b668a;border-radius:17px;padding:15px;background:linear-gradient(145deg,#1b405d,#10263a 75%);color:var(--text);overflow:hidden;transition:transform .15s,border-color .15s}
    .tile:active{transform:scale(.98)}.tile:before{content:"";position:absolute;left:-22px;bottom:-42px;width:120px;height:120px;border:1px solid #73c9f51b;border-radius:50%}
    .tile .ico{font-size:29px;display:block;margin-bottom:12px}.tile strong{display:block;font-size:15px;line-height:1.5}.tile small{display:block;color:#9fc3dc;font-size:10px;letter-spacing:.7px;margin-top:4px;direction:ltr;text-align:right}.tile .count{display:block;color:#75cffa;font-size:11px;margin-top:9px}
    .feature{grid-column:span 2;min-height:112px;background:linear-gradient(110deg,#1c4e70,#132b40 75%)}
    .feature .ico{float:right;margin:2px 0 0 15px;font-size:35px}
    .search{width:100%;margin-top:17px;border:1px solid #315c78;background:#0b1e2e;color:white;padding:12px 14px;border-radius:12px;outline:none}
    .search:focus{border-color:var(--cyan)}.muted{color:var(--muted)}
    .panel{background:#10263a;border:1px solid #2b5876;border-radius:17px;padding:15px;margin-top:13px}
    .row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}.back{border:1px solid #416d89;background:#17364e;color:white;border-radius:10px;padding:8px 12px}
    .item-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #29465c}.item-row:last-child{border:0}.item-icon{font-size:24px}.item-row button{margin-right:auto;border:1px solid #39789d;background:#173b55;color:#dff5ff;border-radius:9px;padding:8px 11px}
    .primary{border:0;border-radius:12px;background:linear-gradient(90deg,#168ac2,#42b7ec);color:#041827;font-weight:800;padding:12px 16px;width:100%;margin-top:12px}
    .secondary{border:1px solid #427a9b;border-radius:10px;background:#18384f;color:#e7f6ff;padding:9px 12px}
    .admin{border:1px solid #927a42;background:#3a321e;color:#ffe6a7;border-radius:10px;padding:8px 10px;font-size:12px}
    .field{display:block;width:100%;margin:8px 0;padding:11px;border-radius:10px;border:1px solid #345b75;background:#081a29;color:white}
    label{font-size:12px;color:#b9d1e2}.hidden{display:none!important}.empty{text-align:center;padding:28px 10px;color:#a9bfd0}
    .footer{text-align:center;color:#6f91a8;font-size:10px;letter-spacing:1.5px;margin:24px 0 5px;direction:ltr}
    .nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0a1b2bF2;border-top:1px solid #28658a;backdrop-filter:blur(14px);padding:9px max(12px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr;max-width:760px;margin:auto}.nav.admin-visible{grid-template-columns:repeat(2,minmax(0,1fr))}
    .nav button{border:0;background:transparent;color:#91adc2;font-size:10px;padding:4px 2px}.nav button b{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:#8bdcff}
    .toast{position:fixed;top:12px;left:12px;right:12px;max-width:500px;margin:auto;background:#173d52;border:1px solid #55a8d2;border-radius:12px;padding:12px;z-index:30;text-align:center}
    @media(min-width:600px){.tile{min-height:150px;padding:19px}.hero{padding:28px}.wrap{padding-top:22px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <div><div class="logo">✈ UASE</div><div class="eyebrow">AVIATION COMMAND CENTER</div></div>
      <div class="status">● SYSTEM ONLINE</div>
    </div>
    <h1>مرحباً بك في مركز القيادة الأكاديمية</h1>
    <p class="sub">Your academic navigation system</p>
    <div class="welcome-ar">أهلاً بك في مساحتك الدراسية</div>
    <div class="welcome-en">DREAM · LEARN · FLY</div>
    <input id="search" class="search" placeholder="ابحث عن مادة أو مختبر..." autocomplete="off">
  </header>
  <main id="main">
    <div class="section-head"><h2>وجهتك الدراسية</h2><span>QUICK NAVIGATION</span></div>
    <div class="grid">
      <button class="tile feature" onclick="showCategory('subject')"><span class="ico">📚</span><strong>المواد النظرية</strong><small>ACADEMIC SUBJECTS</small><span class="count">06 SUBJECTS　 ↗</span></button>
      <button class="tile" onclick="showCategory('lab')"><span class="ico">🧪</span><strong>المختبرات العملية</strong><small>LABORATORIES</small><span class="count">02 LABS　 ↗</span></button>
      <button class="tile" onclick="showCategory('schedule')"><span class="ico">📅</span><strong>جدول المحاضرات</strong><small>TIMETABLE</small><span class="count">VIEW SCHEDULE　 ↗</span></button>
      <button class="tile feature" onclick="showCategory('resources')"><span class="ico">☁️</span><strong>مكتبة الملازم والمصادر</strong><small>RESOURCE CENTER</small><span class="count">GOOGLE DRIVE　 ↗</span></button>
    </div>
    <div class="footer">UASE · ENGINEERING EXCELLENCE IN AVIATION · V1.0</div>
  </main>
</div>
<nav class="nav" id="bottom-nav">
  <button class="active" onclick="goHome(this)"><b>⌂</b>الرئيسية<br>Home</button>
  <button id="admin-nav-entry" class="hidden" onclick="showAdmin(this)"><b>⚙</b>إدارة المنصة<br>Admin</button>
</nav>
<div id="toast" class="toast hidden"></div>
<script>
let tg = null;
let initData = "";
let telegramInitialized = false;

let state = {items:[], isAdmin:false, user:null};
let bootStarted = false;

const labels = {
  subject:["المواد النظرية","THEORETICAL SUBJECTS"],
  lab:["المختبرات العملية","LABORATORIES"],
  schedule:["جدول المحاضرات","TIMETABLE"],
  resources:["مكتبة الملازم والمصادر","RESOURCE CENTER"]
};

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'),2600);
}

function showStartupError(message) {
  document.getElementById('main').innerHTML =
    '<div class="panel empty">' + escapeHtml(message) + '</div>';
}

async function api(path, options={}) {
  const headers = {...(options.headers||{}), 'Authorization':'tma '+initData};
  if(options.body) headers['Content-Type']='application/json';

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);

  try {
    const res = await fetch(path,{...options,headers,signal:controller.signal});
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail||'حدث خطأ في الاتصال');
    return data;
  } catch (error) {
    if (error.name === 'AbortError') {
      throw new Error('استغرق الاتصال بالخادم وقتاً أطول من المعتاد. حاول إعادة فتح المنصة.');
    }
    throw error;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function boot(){
  if (bootStarted) return;
  bootStarted = true;

  if(!initData){
    showStartupError('افتح المنصة من داخل تيليجرام باستخدام زر البوت.\\nPlease open this Mini App from Telegram.');
    return;
  }

  try{
    const data=await api('/api/bootstrap');
    state.items=data.items || [];
    state.isAdmin=!!data.is_admin;
    state.user=data.user || null;

    if(state.isAdmin) {
      const adminNav=document.getElementById('admin-nav-entry');
      const bottomNav=document.getElementById('bottom-nav');
      if(adminNav) adminNav.classList.remove('hidden');
      if(bottomNav) bottomNav.classList.add('admin-visible');
    }

    document.getElementById('search').addEventListener('input',e=>searchItems(e.target.value));
  }catch(e){
    showStartupError(e.message);
    bootStarted = false;
  }
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function goHome(btn){
  document.getElementById('main').innerHTML=homeMarkup();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelector('.nav button').classList.add('active');
}

function homeMarkup(){
  return `<div class="section-head"><h2>وجهتك الدراسية</h2><span>QUICK NAVIGATION</span></div><div class="grid">
  <button class="tile feature" onclick="showCategory('subject')"><span class="ico">📚</span><strong>المواد النظرية</strong><small>ACADEMIC SUBJECTS</small><span class="count">06 SUBJECTS　 ↗</span></button>
  <button class="tile" onclick="showCategory('lab')"><span class="ico">🧪</span><strong>المختبرات العملية</strong><small>LABORATORIES</small><span class="count">02 LABS　 ↗</span></button>
  <button class="tile" onclick="showCategory('schedule')"><span class="ico">📅</span><strong>جدول المحاضرات</strong><small>TIMETABLE</small><span class="count">VIEW SCHEDULE　 ↗</span></button>
  <button class="tile feature" onclick="showCategory('resources')"><span class="ico">☁️</span><strong>مكتبة الملازم والمصادر</strong><small>RESOURCE CENTER</small><span class="count">GOOGLE DRIVE　 ↗</span></button></div>
  <div class="footer">UASE · ENGINEERING EXCELLENCE IN AVIATION · V1.0</div>`;
}

function showCategory(category, navBtn){
  const found=state.items.filter(x=>x.category===category);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(navBtn) navBtn.classList.add('active');
  document.getElementById('main').innerHTML=`<div class="section-head"><div><button class="back" onclick="goHome()">← الرئيسية</button><h2 style="margin-top:12px">${labels[category][0]}</h2></div><span>${labels[category][1]}</span></div><div class="panel">${found.length?found.map(itemRow).join(''):'<div class="empty">لا توجد عناصر في هذا القسم حالياً.</div>'}</div><div class="footer">UASE · ${labels[category][1]}</div>`;
  bindOpenItems();
}

function itemRow(x){
  return `<div class="item-row"><span class="item-icon">${escapeHtml(x.icon)}</span><div class="grow"><strong>${escapeHtml(x.title_ar)}</strong><div class="muted" style="font-size:11px;direction:ltr;text-align:right">${escapeHtml(x.title_en)}</div></div><button data-open-item="${escapeHtml(x.id)}">فتح ↗</button></div>`;
}

function bindOpenItems(){
  document.querySelectorAll("[data-open-item]").forEach(b=>b.addEventListener("click",()=>openItem(b.dataset.openItem)));
}

function openItem(id){
  const x=state.items.find(i=>i.id===id);
  if(!x)return;
  document.getElementById('main').innerHTML=`<div class="section-head"><button class="back" onclick="showCategory('${x.category}')">← رجوع</button><span>DESTINATION / ${escapeHtml(x.category.toUpperCase())}</span></div><div class="panel" style="text-align:center;padding:25px 17px"><div style="font-size:45px">${escapeHtml(x.icon)}</div><h2>${escapeHtml(x.title_ar)}</h2><div class="muted" dir="ltr">${escapeHtml(x.title_en)}</div><p class="muted" style="line-height:1.8">${escapeHtml(x.description)}</p>${x.url?'<button class="primary" id="open-current-url">فتح المحتوى　↗</button>':'<div class="empty">لم تتم إضافة رابط لهذا القسم بعد.</div>'}${state.isAdmin?'<button class="secondary" style="margin-top:12px" id="edit-current-item">تعديل بيانات هذا القسم</button>':''}</div>`;
  const openBtn=document.getElementById("open-current-url");
  if(openBtn) openBtn.addEventListener("click",()=>openLink(x.url));
  const editBtn=document.getElementById("edit-current-item");
  if(editBtn) editBtn.addEventListener("click",()=>editItem(x.id));
}

function openLink(url){
  if(!/^https:\/\/|^tg:\/\//i.test(url)){toast('الرابط غير صالح');return}
  if(tg) tg.openLink(url);
  else window.open(url,'_blank','noopener');
}

function searchItems(q){
  const value=q.trim().toLowerCase();
  if(!value){goHome();return}
  const found=state.items.filter(x=>(x.title_ar+' '+x.title_en+' '+x.description).toLowerCase().includes(value));
  document.getElementById('main').innerHTML=`<div class="section-head"><h2>نتائج البحث</h2><span>SEARCH RESULTS</span></div><div class="panel">${found.length?found.map(itemRow).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}</div>`;
  bindOpenItems();
}

function showAdmin(navBtn){
  if(!state.isAdmin)return;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const adminButton=navBtn || document.getElementById('admin-nav-entry');
  if(adminButton) adminButton.classList.add('active');
  document.getElementById('main').innerHTML=`<div class="section-head"><button class="back" onclick="goHome()">← الرئيسية</button><span>ADMIN CONSOLE</span></div><div class="panel"><h2>إدارة المحتوى</h2><p class="muted" style="font-size:12px">إضافة العناصر وتعديل عناوينها وروابطها.</p><button class="primary" onclick="editItem(null)">＋ إضافة قسم جديد</button><div style="margin-top:15px">${state.items.map(x=>`<div class="item-row"><span>${escapeHtml(x.icon)}</span><div class="grow"><strong>${escapeHtml(x.title_ar)}</strong><div class="muted" style="font-size:11px">${escapeHtml(x.category)}</div></div><button onclick="editItem('${escapeHtml(x.id)}')">تعديل</button></div>`).join('')}</div></div>`;
}

function editItem(id){
  const x=id?state.items.find(i=>i.id===id):{id:'',title_ar:'',title_en:'',category:'subject',icon:'📘',description:'',url:'',sort_order:100};
  document.getElementById('main').innerHTML=`<div class="section-head"><button class="back" onclick="showAdmin()">← الإدارة</button><span>ITEM CONFIGURATION</span></div><form class="panel" id="edit-form">
  <label>المعرّف (إنشاء عنصر جديد فقط)</label><input class="field" name="id" value="${escapeHtml(x.id)}" ${id?'readonly':''} required pattern="[a-z0-9-]+">
  <label>الاسم بالعربية</label><input class="field" name="title_ar" value="${escapeHtml(x.title_ar)}" required>
  <label>الاسم بالإنجليزية</label><input class="field" name="title_en" value="${escapeHtml(x.title_en)}" required>
  <label>القسم</label><select class="field" name="category"><option value="subject" ${x.category==='subject'?'selected':''}>مواد نظرية</option><option value="lab" ${x.category==='lab'?'selected':''}>مختبرات</option><option value="schedule" ${x.category==='schedule'?'selected':''}>جدول</option><option value="resources" ${x.category==='resources'?'selected':''}>مصادر</option></select>
  <label>الرمز</label><input class="field" name="icon" value="${escapeHtml(x.icon)}">
  <label>الوصف</label><textarea class="field" name="description">${escapeHtml(x.description)}</textarea>
  <label>الرابط HTTPS</label><input class="field" name="url" type="url" value="${escapeHtml(x.url)}" placeholder="https://...">
  <label>ترتيب العرض</label><input class="field" name="sort_order" type="number" value="${x.sort_order}">
  <button class="primary" type="submit">حفظ التغييرات</button>${id?'<button class="secondary" type="button" style="width:100%;margin-top:9px" id="delete-current-item">حذف العنصر</button>':''}
  </form>`;
  document.getElementById('edit-form').addEventListener('submit',saveItem);
  const deleteBtn=document.getElementById('delete-current-item');
  if(deleteBtn) deleteBtn.addEventListener('click',()=>removeItem(id));
}

async function saveItem(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const payload=Object.fromEntries(f.entries());
  payload.sort_order=Number(payload.sort_order||100);
  try{
    const exists=state.items.some(x=>x.id===payload.id);
    await api(exists?'/api/items/'+payload.id:'/api/items',{method:exists?'PUT':'POST',body:JSON.stringify(payload)});
    const d=await api('/api/bootstrap');
    state.items=d.items;
    toast('تم حفظ البيانات');
    showAdmin();
  }catch(err){toast(err.message)}
}

async function removeItem(id){
  if(!confirm('هل تريد حذف هذا العنصر؟'))return;
  try{
    await api('/api/items/'+id,{method:'DELETE'});
    state.items=state.items.filter(x=>x.id!==id);
    toast('تم الحذف');
    showAdmin();
  }catch(e){toast(e.message)}
}

function initializeTelegramApp() {
  if (telegramInitialized) return;

  tg = window.Telegram?.WebApp || null;
  if (!tg) {
    showStartupError('تعذر تهيئة تطبيق تيليجرام. أغلق المنصة وافتحها مجدداً من زر البوت.');
    return;
  }

  telegramInitialized = true;

  // Notify Telegram as soon as the Web App API is available.
  try {
    tg.ready();
  } catch (e) {
    console.warn('Telegram ready:', e);
  }

  // Apply the Mini App appearance separately so an appearance error
  // cannot prevent the ready signal above.
  try {
    tg.expand();
    tg.setHeaderColor('#101d2b');
    tg.setBackgroundColor('#091522');
  } catch (e) {
    console.warn('Telegram appearance setup:', e);
  }

  initData = typeof tg.initData === 'string' ? tg.initData : "";

  if (!initData) {
    showStartupError('لم تصل بيانات جلسة تيليجرام. أغلق المنصة وافتحها مجدداً من زر البوت.');
    return;
  }

  boot();
}

const telegramSdk = document.getElementById('telegram-sdk');
if (window.Telegram?.WebApp) {
  initializeTelegramApp();
} else if (telegramSdk) {
  telegramSdk.addEventListener('load', initializeTelegramApp, { once: true });
  telegramSdk.addEventListener('error', () => {
    showStartupError('تعذر تحميل مكتبة تيليجرام. تحقق من الاتصال ثم أعد فتح المنصة.');
  }, { once: true });
} else {
  showStartupError('تعذر العثور على مكتبة تيليجرام داخل الصفحة.');
}
</script>
</body>
</html>
